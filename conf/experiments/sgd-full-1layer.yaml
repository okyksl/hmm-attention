# @package _global_

defaults:
  - override /optimizer: sgd
  - _self_

misc:
  log_attention_frequency: 200
  wandb:
    tags: ["sgd-full-1layer"]
  
trainer:
  ngram_steps: 3000
  steps: 6000

teacher:
  span_lengths: [4, 4, 4]
  lag_spectrum: {law: geometric, decay: 2.0}

student:
  attention_bias: false

optimizer:
  lr: 0.2